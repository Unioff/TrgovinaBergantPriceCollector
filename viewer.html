<!DOCTYPE html>
<html lang="sl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Pregled cen</title>
<style>
  body { font-family: system-ui, sans-serif; margin: 0; padding: 24px; max-width: 960px; margin-inline: auto; color: #000; }
  label.select { display: flex; gap: 12px; align-items: center; font-size: 18px; margin-bottom: 24px; }
  select { font-size: 18px; padding: 4px 8px; }
  h2 { font-size: 16px; margin: 0 0 8px; color: #444; }
  #latest { list-style: none; padding: 0; margin: 0 0 32px; }
  #latest li { display: flex; justify-content: space-between; font-size: 20px; padding: 6px 0; border-bottom: 1px solid #ddd; color: #000; }
  #latest li.best { color: #0a8a2a; font-weight: 700; }
  #latest .date { font-size: 12px; color: #777; font-weight: 400; margin-left: 12px; }
  #vendors { display: flex; flex-wrap: wrap; gap: 16px; margin-bottom: 12px; }
  #vendors label { display: flex; align-items: center; gap: 6px; cursor: pointer; }
  #vendors .swatch { width: 12px; height: 12px; border-radius: 50%; display: inline-block; }
  svg { width: 100%; height: auto; background: #fafafa; border: 1px solid #ddd; }
  .empty { color: #777; padding: 24px 0; }
</style>
</head>
<body>
<label class="select">Postavka:
  <select id="artikel"></select>
</label>

<h2>Zadnje cene</h2>
<ul id="latest"></ul>

<h2>Časovnica</h2>
<div id="vendors"></div>
<div id="chart"></div>

<script>
const COLORS = ["#1f77b4", "#ff7f0e", "#9467bd", "#d62728", "#8c564b", "#17becf", "#e377c2", "#7f7f7f"];
const SVGNS = "http://www.w3.org/2000/svg";
const $ = (id) => document.getElementById(id);
const fmt = (p) => p.toFixed(2).replace(".", ",") + " €";
const fmtDate = (t) => new Date(t).toLocaleString("sl-SI", { dateStyle: "short", timeStyle: "short" });

let data;
const hidden = new Set(); // trgovina id, ki so izključene iz grafa

function svg(name, attrs = {}, text) {
  const el = document.createElementNS(SVGNS, name);
  for (const [k, v] of Object.entries(attrs)) el.setAttribute(k, v);
  if (text !== undefined) el.textContent = text;
  return el;
}

function pricesFor(artikelId) {
  return data.cene.filter((c) => c.artikel_id === artikelId);
}

function renderLatest(artikelId) {
  const rows = pricesFor(artikelId);
  const latest = new Map();
  for (const c of rows) latest.set(c.trgovina_id, c); // cene so urejene po datumu
  const min = Math.min(...[...latest.values()].filter((c) => c.price > 0).map((c) => c.price));

  const ul = $("latest");
  ul.replaceChildren();
  for (const t of data.trgovine) {
    const c = latest.get(t.id);
    const li = document.createElement("li");
    const name = document.createElement("span");
    name.textContent = t.name;
    const price = document.createElement("span");
    if (c && c.price === 0) {
      price.textContent = "ni več v prodaji";
    } else if (c) {
      price.textContent = fmt(c.price);
      const d = document.createElement("span");
      d.className = "date";
      d.textContent = fmtDate(c.date);
      price.append(d);
      if (c.price === min) li.className = "best";
    } else {
      price.textContent = "ni cene";
    }
    li.append(name, price);
    ul.append(li);
  }
}

function renderVendorChecks(artikelId) {
  const present = new Set(pricesFor(artikelId).filter((c) => c.price > 0).map((c) => c.trgovina_id));
  const box = $("vendors");
  box.replaceChildren();
  data.trgovine.forEach((t, i) => {
    const label = document.createElement("label");
    const cb = document.createElement("input");
    cb.type = "checkbox";
    cb.checked = !hidden.has(t.id);
    cb.disabled = !present.has(t.id);
    cb.addEventListener("change", () => {
      cb.checked ? hidden.delete(t.id) : hidden.add(t.id);
      renderChart(artikelId);
    });
    const sw = document.createElement("span");
    sw.className = "swatch";
    sw.style.background = COLORS[i % COLORS.length];
    label.append(cb, sw, t.name);
    box.append(label);
  });
}

function renderChart(artikelId) {
  const host = $("chart");
  host.replaceChildren();
  const all = pricesFor(artikelId);
  const tLatest = Math.max(...all.map((c) => new Date(c.date).getTime()));
  // Vsaka trgovina, ki je kdaj imela ceno, se konča z zadnjo ceno ob zadnji točki časovnice.
  // Cena 0 pomeni, da izdelka ni več: črta se do tega trenutka nadaljuje z zadnjo ceno, nato se prekine.
  const series = new Map(); // trgovina id -> odseki (polja točk)
  for (const tr of data.trgovine) {
    if (hidden.has(tr.id)) continue;
    const pts = all.filter((c) => c.trgovina_id === tr.id);
    const segments = [];
    let seg = [];
    for (const c of pts) {
      if (c.price > 0) {
        seg.push(c);
      } else if (seg.length) {
        seg.push({ ...seg[seg.length - 1], date: c.date, carried: true, note: "ukinjeno" });
        segments.push(seg);
        seg = [];
      }
    }
    if (seg.length) {
      const last = seg[seg.length - 1];
      if (new Date(last.date).getTime() < tLatest) {
        seg.push({ ...last, date: new Date(tLatest).toISOString(), carried: true, note: "zadnja znana cena" });
      }
      segments.push(seg);
    }
    if (segments.length) series.set(tr.id, segments);
  }
  const rows = [...series.values()].flat(2);
  if (!rows.length) {
    host.innerHTML = '<div class="empty">Ni podatkov za prikaz.</div>';
    return;
  }

  const W = 900, H = 380, m = { l: 64, r: 24, t: 20, b: 48 };
  const times = rows.map((c) => new Date(c.date).getTime());
  const prices = rows.map((c) => c.price);
  let t0 = Math.min(...times), t1 = Math.max(...times);
  if (t0 === t1) { t0 -= 12 * 3600e3; t1 += 12 * 3600e3; }
  let p0 = Math.min(...prices), p1 = Math.max(...prices);
  const pad = (p1 - p0) * 0.1 || p0 * 0.1 || 1;
  p0 = Math.max(0, p0 - pad); p1 += pad;

  const x = (t) => m.l + ((t - t0) / (t1 - t0)) * (W - m.l - m.r);
  const y = (p) => H - m.b - ((p - p0) / (p1 - p0)) * (H - m.t - m.b);

  const s = svg("svg", { viewBox: `0 0 ${W} ${H}` });
  for (let i = 0; i <= 5; i++) {
    const p = p0 + ((p1 - p0) * i) / 5;
    s.append(svg("line", { x1: m.l, x2: W - m.r, y1: y(p), y2: y(p), stroke: "#e2e2e2" }));
    s.append(svg("text", { x: m.l - 8, y: y(p) + 4, "text-anchor": "end", "font-size": 12, fill: "#555" }, fmt(p)));
  }
  for (let i = 0; i <= 4; i++) {
    const t = t0 + ((t1 - t0) * i) / 4;
    s.append(svg("text", { x: x(t), y: H - m.b + 20, "text-anchor": "middle", "font-size": 12, fill: "#555" },
      new Date(t).toLocaleDateString("sl-SI")));
  }
  s.append(svg("line", { x1: m.l, x2: m.l, y1: m.t, y2: H - m.b, stroke: "#999" }));
  s.append(svg("line", { x1: m.l, x2: W - m.r, y1: H - m.b, y2: H - m.b, stroke: "#999" }));

  data.trgovine.forEach((tr, i) => {
    const segments = series.get(tr.id);
    if (!segments) return;
    const color = COLORS[i % COLORS.length];
    for (const seg of segments) {
      const coords = seg.map((c) => [x(new Date(c.date).getTime()), y(c.price)]);
      if (coords.length > 1) {
        s.append(svg("polyline", { points: coords.map((c) => c.join(",")).join(" "), fill: "none", stroke: color, "stroke-width": 2 }));
      }
      seg.forEach((c, j) => {
        const dot = svg("circle", {
          cx: coords[j][0], cy: coords[j][1], r: 4.5,
          fill: c.carried ? "#fafafa" : color, stroke: color, "stroke-width": 2,
        });
        const note = c.note ? ` - ${c.note}` : "";
        dot.append(svg("title", {}, `${tr.name}: ${fmt(c.price)} (${fmtDate(c.date)})${note}`));
        s.append(dot);
      });
    }
  });
  host.append(s);
}

function render() {
  const id = Number($("artikel").value);
  renderLatest(id);
  renderVendorChecks(id);
  renderChart(id);
}

fetch("/api/data")
  .then((r) => {
    if (!r.ok) throw new Error(r.status);
    return r.json();
  })
  .then((d) => {
    data = d;
    const sel = $("artikel");
    for (const a of data.artikli) sel.add(new Option(a.name, a.id));
    sel.addEventListener("change", render);
    render();
  })
  .catch(() => {
    $("chart").innerHTML = '<div class="empty">Podatkov ni mogoče naložiti. Zaženite <code>python viewer.py</code> in odprite http://127.0.0.1:8000/ (datoteke viewer.html ne odpirajte neposredno).</div>';
  });
</script>
</body>
</html>
